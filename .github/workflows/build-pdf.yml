name: Build PDF

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      MIKTEX_AUTOINSTALL: t
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc
        shell: pwsh
        run: |
          $ver = "3.9.0.2"
          $zip = Join-Path $env:RUNNER_TEMP "pandoc.zip"
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/$ver/pandoc-$ver-windows-x86_64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "pandoc") -Force
          $pandocDir = Split-Path -Parent (Get-ChildItem -Recurse -Path (Join-Path $env:RUNNER_TEMP "pandoc") -Filter pandoc.exe | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_PATH -Value $pandocDir

      - name: Install pandoc-crossref
        shell: pwsh
        run: |
          choco install 7zip --yes --no-progress
          $archive = Join-Path $env:RUNNER_TEMP "crossref.7z"
          Invoke-WebRequest -Uri "https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.24a/pandoc-crossref-Windows-X64.7z" -OutFile $archive
          $out = Join-Path $env:RUNNER_TEMP "crossref"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x $archive "-o$out" -y
          $crossrefDir = Split-Path -Parent (Get-ChildItem -Recurse -Path $out -Filter pandoc-crossref.exe | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_PATH -Value $crossrefDir

      - name: Install Make and MiKTeX
        shell: pwsh
        run: |
          choco install make miktex --yes --no-progress
          $miktex = "C:\Program Files\MiKTeX\miktex\bin\x64"
          if (Test-Path $miktex) {
            Add-Content -Path $env:GITHUB_PATH -Value $miktex
          }

      - name: Enable MiKTeX auto-install
        shell: pwsh
        run: |
          initexmf --set-config-value "[MPM]AutoInstall=1"
          pandoc --version
          pandoc-crossref --version
          xelatex --version

      - name: Build PDF
        shell: pwsh
        run: make runpandoc

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: result_article
          path: result_article.pdf

      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PDF статьи
          body: |
            Автосборка Markdown → PDF.
            Коммит: ${{ github.sha }}
          files: result_article.pdf
          fail_on_unmatched_files: true
          make_latest: true
